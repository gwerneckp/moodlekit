[project]
name = "pymoodlekit"
version = "0.1.1"
description = "Use Moodle programmatically with your existing browser login. Works with SSO, no API token needed."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Gabriel Werneck" }]
keywords = ["moodle", "sso", "university", "cli", "mcp"]
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "browser-cookie3>=0.19",
]

[project.optional-dependencies]
pdf = ["playwright>=1.40", "pypdf>=4"]
mcp = ["mcp>=2"]

[project.scripts]
moodle = "moodlekit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "responses>=0.25", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moodlekit"]

[tool.hatch.build.targets.sdist]
exclude = ["assets/"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
