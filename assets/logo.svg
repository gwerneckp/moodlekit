<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="512" height="512">
  <title>moodlekit</title>
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6e3b4"/>
      <stop offset="0.6" stop-color="#e8c170"/>
      <stop offset="1" stop-color="#c99a45"/>
    </linearGradient>
    <clipPath id="tile"><rect x="18" y="34" width="124" height="124" rx="30"/></clipPath>
  </defs>
  <!-- tile: warm Bath stone -->
  <rect x="18" y="34" width="124" height="124" rx="30" fill="url(#stone)"/>
  <rect x="18" y="152" width="124" height="6" fill="#000" opacity="0.12" clip-path="url(#tile)"/>
  <!-- terminal prompt >_ -->
  <polyline points="52,91 70,106 52,121" fill="none" stroke="#0a1628" stroke-width="11"
            stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="80" y="113" width="31" height="10" rx="3" fill="#0a1628"/>
  <!-- mortarboard -->
  <g transform="translate(34 0) rotate(-8 46 30)">
    <polygon points="46,4 90,22 46,40 2,22" fill="#0a1628"/>
    <path d="M22 30 v14 q24 14 48 0 v-14 l-24 10 z" fill="#0a1628"/>
    <path d="M78 26 v18" stroke="#e8c170" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="78" cy="47" r="4.5" fill="#e8c170"/>
  </g>
</svg>
